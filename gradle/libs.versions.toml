# Aliases use camelCase — Gradle generates type-safe accessors directly from these names.
# e.g. libs.timber, libs.composeBom, libs.kotlinxCoroutinesCore

[versions]
activity = "1.12.4"
agp = "8.13.2"
androidxCoreKtx = "1.17.0"
androidxDatastore = "1.1.7"
androidxHilt = "1.3.0"
androidxHiltNavCompose = "1.2.0"
androidxNavigation = "2.9.7"
composeBom = "2024.12.01"
composeCompiler = "2.3.10"
hilt = "2.57.2"
junit = "4.13.2"
kotlin = "2.3.10"
ktlintCli = "1.7.1"
kotlinxCoroutines = "1.10.2"
ksp = "2.3.6"
lifecycleRuntimeCompose = "2.6.2"
material3 = "1.4.0"
mockk = "1.14.9"
timber = "5.0.1"
truth = "1.4.5"
turbine = "1.2.0"

[libraries]
# build-logic dependencies
androidGradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlinGradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kspGradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }

# AndroidX Core
androidxCoreKtx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
activityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }

# Compose
composeBom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
composeAnimation = { group = "androidx.compose.animation", name = "animation" }
composeFoundation = { group = "androidx.compose.foundation", name = "foundation" }
composeMaterial3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
composeMaterialIconsExtended = { group = "androidx.compose.material", name = "material-icons-extended" }
composeUi = { group = "androidx.compose.ui", name = "ui" }
composeUiTooling = { group = "androidx.compose.ui", name = "ui-tooling" }
composeUiToolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
composeUiUtil = { group = "androidx.compose.ui", name = "ui-util" }

# Lifecycle
lifecycleRuntimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
lifecycleViewmodelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeCompose" }

# Navigation
navigationCompose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# Hilt
androidxHiltNavCompose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavCompose" }
androidxHiltCompiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
daggerHiltCompiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
daggerHiltCore = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }

# DataStore
datastorePreferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# Logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Coroutines
kotlinxCoroutinesCore = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Ktlint
ktlintCli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlintCli" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
androidApplicationPlugin = { id = "com.android.application", version.ref = "agp" }
hiltPlugin = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlinAndroidPlugin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinComposePlugin = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kspPlugin = { id = "com.google.devtools.ksp", version.ref = "ksp" }
